[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapc"
version = "0.2.0"
description = "Closed-form completion of missing class-domain prototypes"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["rapc*", "experiments*"]
