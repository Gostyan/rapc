[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protofill"
version = "0.1.0"
description = "Closed-form completion of missing class-domain prototypes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
]

[tool.setuptools.packages.find]
include = ["protofill*", "experiments*"]
